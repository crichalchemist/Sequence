name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint-and-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tool
        run: pip install ruff

      - name: Lint for critical errors
        run: ruff check --select E9,F63,F7,F82 .

      - name: Sanity compile
        run: python -m compileall .

      - name: Import smoke test
        run: |
          python - <<'PY'
          import importlib
          import sys
          
          # Core modules that must work
          core_modules = [
              "data.download_gdelt",
              "utils.run_training_pipeline",
              "eval.run_evaluation",
          ]
          
          # Optional modules (heavy dependencies, may fail due to version conflicts)
          optional_modules = [
              "train.experiments.run_finetune_novasky",
              "train.experiments.run_finetune_novasky_lora",
          ]
          
          failed = []
          for m in core_modules:
              try:
                  importlib.import_module(m)
                  print(f"✓ {m}")
              except Exception as e:
                  print(f"✗ {m}: {str(e)[:80]}")
                  failed.append(m)
          
          # Try optional modules but don't fail if they have unresolvable dependencies
          for m in optional_modules:
              try:
                  importlib.import_module(m)
                  print(f"✓ {m}")
              except Exception as e:
                  print(f"⚠ {m}: {str(e)[:80]} (optional, skipping)")
          
          if failed:
              print(f"\n❌ Failed to import core modules: {failed}")
              sys.exit(1)
          
          print("\n✅ Core modules import OK")
          PY

  tests:
    runs-on: ubuntu-latest
    needs: lint-and-sanity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest testcontainers

      - name: Run pytest (allows empty suite)
        run: |
          set -euo pipefail
          if pytest --maxfail=1 --disable-warnings -q; then
            exit 0
          else
            status=$?
            if [ "$status" -eq 5 ]; then
              echo "No tests collected; skipping."
              exit 0
            fi
            exit "$status"
          fi
