name: Sentry Monitoring & Error Tracking

on:
  workflow_run:
    workflows: ["Comprehensive CI/CD Pipeline"]
    types: [completed]
  push:
    branches: [main, master, develop]
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  # ============================================================================
  # Monitor Test Failures & Send to Sentry
  # ============================================================================
  monitor-failures:
    name: Monitor & Report Failures
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Sentry CLI
        run: |
          pip install sentry-sdk -q

      - name: Report workflow failure to Sentry
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          python << 'EOF'
          import os
          import json
          from datetime import datetime
          import requests
          
          # Sentry integration for workflow failures
          sentry_dsn = os.getenv('SENTRY_DSN')
          auth_token = os.getenv('SENTRY_AUTH_TOKEN')
          org = os.getenv('SENTRY_ORG')
          project = os.getenv('SENTRY_PROJECT')
          
          if not all([sentry_dsn, auth_token, org, project]):
              print("Sentry credentials not configured")
              exit(0)
          
          # Report the failure
          headers = {
              'Authorization': f'Bearer {auth_token}',
              'Content-Type': 'application/json',
          }
          
          event_data = {
              'message': 'GitHub Actions workflow failed',
              'level': 'error',
              'environment': 'ci-cd',
              'tags': {
                  'workflow': '${{ github.workflow }}',
                  'repo': '${{ github.repository }}',
                  'branch': '${{ github.ref }}',
              },
              'extra': {
                  'workflow_run_id': '${{ github.event.workflow_run.id }}',
                  'actor': '${{ github.actor }}',
                  'timestamp': datetime.utcnow().isoformat(),
              }
          }
          
          url = f'https://sentry.io/api/0/projects/{org}/{project}/events/'
          response = requests.post(url, json=event_data, headers=headers)
          print(f"Sentry report status: {response.status_code}")
          EOF

  # ============================================================================
  # Health Check & Uptime Monitoring
  # ============================================================================
  health-check:
    name: System Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -q
          pip install pytest -q

      - name: Run health check tests
        id: health
        continue-on-error: true
        run: |
          pytest tests/verification/ -v --tb=short || true

      - name: Report health status
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          python << 'EOF'
          import os
          import sys
          import json
          
          status = '${{ steps.health.outcome }}'
          
          if status == 'failure':
              print("⚠️ Health check failed")
              print("::warning::System health check detected issues")
          else:
              print("✅ Health check passed")
          
          # Log to GitHub Step Summary
          summary = """
          ### System Health Check
          - Status: {status}
          - Timestamp: {timestamp}
          - Python Version: 3.11
          - Platform: Linux
          """.format(
              status=status.upper(),
              timestamp=__import__('datetime').datetime.utcnow().isoformat()
          )
          
          with open(os.getenv('GITHUB_STEP_SUMMARY'), 'a') as f:
              f.write(summary)
          EOF

  # ============================================================================
  # Create Sentry Release & Sourcemaps
  # ============================================================================
  sentry-release-artifacts:
    name: Sentry Release Management
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Sentry CLI
        run: |
          curl -sL https://files.pythonhosted.org/packages/sentry-cli/sentry-cli-latest-Linux-x86_64.tgz | tar xz

      - name: Create release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          ./sentry-cli releases create "${{ github.sha }}" --org $SENTRY_ORG --project $SENTRY_PROJECT
          ./sentry-cli releases set-commits "${{ github.sha }}" --auto --org $SENTRY_ORG --project $SENTRY_PROJECT

      - name: Upload sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        continue-on-error: true
        run: |
          # Upload Python source files for debugging
          find . -name "*.py" -path "*/train/*" -o -path "*/rl/*" -o -path "*/data/*" | \
            xargs ./sentry-cli releases files "${{ github.sha }}" upload \
            --org $SENTRY_ORG --project $SENTRY_PROJECT || true

  # ============================================================================
  # Track Performance Metrics
  # ============================================================================
  performance-monitoring:
    name: Performance Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Collect metrics
        run: |
          pip install psutil pytest-benchmark -q
          
          python << 'EOF'
          import os
          import json
          import psutil
          from datetime import datetime
          
          metrics = {
              'timestamp': datetime.utcnow().isoformat(),
              'cpu_percent': psutil.cpu_percent(interval=1),
              'memory_percent': psutil.virtual_memory().percent,
              'disk_percent': psutil.disk_usage('/').percent,
          }
          
          with open('metrics.json', 'w') as f:
              json.dump(metrics, f, indent=2)
          
          print(json.dumps(metrics, indent=2))
          EOF

      - name: Upload metrics
        uses: actions/upload-artifact@v3
        with:
          name: performance-metrics
          path: metrics.json
          retention-days: 90

  # ============================================================================
  # Issue Management & Auto-Triage
  # ============================================================================
  auto-triage:
    name: Auto-Triage Issues
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-assign labels
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug',
              per_page: 10
            });
            
            console.log(`Found ${issues.length} open bugs for triage`);
            
            for (const issue of issues) {
              // Assign priority based on creation time
              const created = new Date(issue.created_at);
              const age = Date.now() - created.getTime();
              const daysOld = age / (1000 * 60 * 60 * 24);
              
              if (daysOld > 30) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['stale']
                });
              }
            }

      - name: Generate metrics report
        run: |
          echo "### Sentry Monitoring Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Active" >> $GITHUB_STEP_SUMMARY
          echo "- **DSN**: Configured" >> $GITHUB_STEP_SUMMARY
          echo "- **Releases**: Automated" >> $GITHUB_STEP_SUMMARY
          echo "- **Error Tracking**: Enabled" >> $GITHUB_STEP_SUMMARY
